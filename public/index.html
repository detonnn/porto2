<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!--==================== UNICONS ====================-->
        <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
      
        <!--==================== SWIPER CSS ====================-->
        
        
        <!--==================== CSS ====================-->

        <link rel="icon" type="image/x-icon" href="<%= BASE_URL %>favicon.ico">
        <link rel="icon" type="image/png" sizes="32x32" href="<%= BASE_URL %>favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="<%= BASE_URL %>favicon-16x16.png">
        <link rel="apple-touch-icon" sizes="180x180" href="<%= BASE_URL %>apple-touch-icon.png">
        <link rel="manifest" href="<%= BASE_URL %>site.webmanifest">
        <link rel="stylesheet" href="<%= BASE_URL %>frontend/assets/css/terminal.css">
        <style>#app{opacity:0;pointer-events:none}#app.is-ready{opacity:1;pointer-events:auto;transition:opacity .4s ease}</style>
        <script>try{if(localStorage.getItem('selected-theme')==='light')document.documentElement.classList.add('light-theme')}catch(e){}</script>
        <title>Portfolio - Ibnu Dexton</title>
    </head>
    <body>
    <script>try{if(localStorage.getItem('selected-theme')==='light')document.body&&document.body.classList.add('light-theme')}catch(e){}</script>
    <div id="app-loader" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg,#0a0e16)"><div class="loader"></div></div>
    <div id="app"></div>
    <script>(function(){var t0=Date.now(),min=1900;function hide(){var el=document.getElementById('app-loader');if(!el||el.dataset.done)return;el.dataset.done=1;var a=document.getElementById('app');if(a)a.classList.add('is-ready');el.style.transition='opacity .4s ease';el.style.opacity='0';setTimeout(function(){el.style.display='none'},450)}addEventListener('load',function(){setTimeout(hide,Math.max(0,min-(Date.now()-t0)))});setTimeout(hide,min+3000)})()</script>
    
    <!--==================== SWIPER JS ====================-->
    <script type="application/javascript" src="./frontend/assets/js/swiper-bundle.min.js"></script>
  </body>
</html>
